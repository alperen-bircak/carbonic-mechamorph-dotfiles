# Replaces /usr/share/xdg-desktop-portal/sway-portals.conf (a user file wins as a whole,
# so the stock lines are copied here). Only FileChooser is new.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# xdg-desktop-portal-gtk's Inhibit needs GNOME session services sway lacks; with none,
# apps (e.g. Firefox) use Wayland's idle-inhibit protocol, which sway has
org.freedesktop.impl.portal.Inhibit=none
# Open and save dialogs are yazi (xdg-desktop-portal-termfilechooser, from the AUR)
org.freedesktop.impl.portal.FileChooser=termfilechooser
