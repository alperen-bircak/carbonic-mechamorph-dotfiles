# Arch-Update: update reminders for pacman, AUR (paru) and Flatpak. See man arch-update.conf.
# sway starts the tray icon and the check timer (arch-update.timer: 15s after login, then every 6h).
# The check sends a notification when there are new updates.

# The tray icon is "passive" when the system is up to date, and waybar's tray hides passive icons,
# so it only shows up when updates are waiting. Restart the tray after changing this.
ShowTrayWhenRelevant

# Whitish icon to match the bar text (default is blue). The "updates available" variant adds a red dot.
TrayIconStyle=light
