# tinty config; see https://github.com/tinted-theming/tinty
#
# Tinty only generates: `just theme-generate` copies what it renders here into
# theme/.config/themes/<theme>, and apps read those files, never tinty's own folder
# (~/.local/share/tinted-theming/tinty). No hooks: reloading is `just theme-sync`.

default-scheme = "base24-ayu-carbon"

[[schemes.extras]]
name = "dotfiles"
path = "~/.config/tinted-theming/tinty/schemes"

# Applying a custom scheme leaves rendered files in the template repo, which would
# block `tinty sync` from updating it without allow-dirty-update.
[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/kitty"
supported-systems = ["base16", "base24"]
allow-dirty-update = true

# Item names must be unique, and tinted-terminal is a large repo, so this shares
# the kitty item's clone.
[[items]]
name = "tinted-terminal-foot"
path = "~/.local/share/tinted-theming/tinty/repos/tinted-terminal"
themes-dir = "themes/foot"
supported-systems = ["base16", "base24"]

# The rest come from dotfiles-templates/, which `just theme-generate` copies to this path.
[[items]]
name = "dotfiles-css"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/css"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-sway"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/sway"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-rofi"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/rofi"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-mako"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/mako"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-swaynag"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/swaynag"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-rofi-config"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/rofi-config"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-shell"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/shell"
supported-systems = ["base24"]

[[items]]
name = "dotfiles-waybar-calendar"
path = "~/.local/share/tinted-theming/tinty/dotfiles-templates"
themes-dir = "themes/waybar-calendar"
supported-systems = ["base24"]
