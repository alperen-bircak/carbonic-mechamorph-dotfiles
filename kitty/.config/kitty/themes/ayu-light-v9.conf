# Ayu light, built from the ayu palette v9.1.0 (npm "ayu", dist/generated/light.js).
# Same colors as Ghostty's themes/ayu-light-v9. ANSI colors come from its `terminal`
# block, except black: upstream #86878c is lighter than the normal text, so text
# printed in "black" ends up fainter than plain text.

# black: editor.fg (upstream #86878c)
color0  #5c6166
color1  #f07171
color2  #86b300
color3  #eba400
color4  #22a4e6
color5  #a37acc
color6  #4cbf99
color7  #adaeb1
color8  #939498
color9  #f07171
color10 #86b300
color11 #eba400
color12 #22a4e6
color13 #a37acc
color14 #4cbf99
color15 #c5c5c8

# ui.bg / surface.base
background #f8f9fa
# editor.fg
foreground #5c6166
# common.accent.tint
cursor #f29718
cursor_text_color #f8f9fa
# editor.selection.active (#035bd626) blended over the background; text keeps its color
selection_background #d3e1f5
selection_foreground none

# Tab bar (only shown with more than one tab): accent for the active tab
tab_bar_background #f8f9fa
active_tab_background #f29718
active_tab_foreground #f8f9fa
inactive_tab_background #f8f9fa
inactive_tab_foreground #939498
