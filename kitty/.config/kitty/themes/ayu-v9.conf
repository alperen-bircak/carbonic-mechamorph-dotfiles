# Ayu dark, built from the ayu palette v9.1.0 (npm "ayu", dist/generated/dark.js).
# Same colors as Ghostty's themes/ayu-v9. ANSI colors come from its `terminal` block,
# except black/brightBlack: upstream sets both to #0a0000, which makes dim text
# (prompt hints, autosuggestions) unreadable.

# black: surface.lift / editor.bg
color0  #10141c
color1  #e6495a
color2  #97c142
color3  #e89d37
color4  #17acf2
color5  #c385fe
color6  #84ceb5
# white: editor.fg (upstream #ffffff)
color7  #bfbdb6
# brightBlack: syntax.comment
color8  #5a6673
color9  #f07178
color10 #aad94c
color11 #ffb454
color12 #59c2ff
color13 #d2a6ff
color14 #95e6cb
color15 #ffffff

# ui.bg / surface.base
background #0d1017
# editor.fg
foreground #bfbdb6
# common.accent.tint
cursor #e6b450
cursor_text_color #0d1017
# editor.selection.active (#3388ff40) blended over the background; text keeps its color
selection_background #172e51
selection_foreground none

# Tab bar (only shown with more than one tab): accent for the active tab,
# surface.lift / syntax.comment for the rest
tab_bar_background #0d1017
active_tab_background #e6b450
active_tab_foreground #0d1017
inactive_tab_background #10141c
inactive_tab_foreground #5a6673
