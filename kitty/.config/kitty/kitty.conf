# kitty config; see /usr/lib/kitty/kitty/options/definition.py or `man kitty.conf`
# for all options

include ~/.config/theme/kitty.conf

font_family FiraCode Nerd Font Mono
# About 14px; the default 11pt felt too big next to Firefox
font_size 10.5

# Small space between the text and the window edges (vertical, horizontal),
# with the leftover space split evenly
window_padding_width 6 8
placement_strategy center

# Don't copy selected text to the clipboard (kitty still sets the primary
# selection on Linux; there's no option to turn that off)
copy_on_select no

# No beep on the terminal bell; the window still gets marked urgent in sway
enable_audio_bell no

# ctrl+enter isn't bound by default, so programs already get it
# (sway's $mod+f does fullscreen)

# Copy and paste like other apps. ctrl+c still interrupts when nothing is selected
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
# ...but leave ctrl+v to Neovim (visual block, Telescope's split); it sets
# in_editor in nvim/.config/nvim/lua/config/autocmds.lua
map --when-focus-on var:in_editor ctrl+v
