# Ayu Light v9: swaynag has no include, so its whole config is rendered here.
# sway's own types set their own colours, so warning and error are both replaced.
font=Fira Code 10

[warning]
background=fafafa
text=5c6166
border=e7eaed
border-bottom=e7eaed
border-bottom-size=0
button-background=e7eaed
button-text=5c6166
button-border-size=0
details-background=fcfcfc

[error]
background=fafafa
text=e65050
border=e7eaed
border-bottom=e7eaed
border-bottom-size=0
button-background=e7eaed
button-text=5c6166
button-border-size=0
details-background=fcfcfc
