# Ayu Carbon: swaynag has no include, so its whole config is rendered here.
# sway's own types set their own colours, so warning and error are both replaced.
font=Fira Code 10

[warning]
background=181818
text=bdbdbd
border=1f1f1f
border-bottom=1f1f1f
border-bottom-size=0
button-background=1f1f1f
button-text=bdbdbd
button-border-size=0
details-background=121212

[error]
background=181818
text=d95757
border=1f1f1f
border-bottom=1f1f1f
border-bottom-size=0
button-background=1f1f1f
button-text=bdbdbd
button-border-size=0
details-background=121212
