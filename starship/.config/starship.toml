# Colours are terminal colour names, so the prompt follows the active theme.
# `->` and `=>` draw as ligatures in kitty; foot shows them as typed.
add_newline = false
format = """
[╭─](bright-black) $username$hostname$directory$git_branch$git_status$nodejs$dotnet$python$cmd_duration$status
[╰─](bright-black) $character"""

[username]
show_always = true
format = "[$user]($style)"
style_user = ""
style_root = "bold red"

[hostname]
ssh_only = false
format = "[@](bright-black)$hostname"

[directory]
truncation_length = 3
truncate_to_repo = false
format = "[:](bright-black)[$path]($style) "
style = "bold cyan"

[git_branch]
format = "[on](bright-black) [$branch]($style) "
style = "purple"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "yellow"
staged = "+${count} "
modified = "~${count} "
deleted = "-${count} "
untracked = "?${count} "
renamed = "r${count} "
conflicted = "!${count} "
stashed = ""
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "

[character]
success_symbol = "=>"
error_symbol = "=>"

[nodejs]
format = "[node $version]($style) "
version_format = "v${major}"
style = "green"

[dotnet]
format = "[.NET $version]($style) "
version_format = "v${major}"
style = "blue"

[python]
format = "[py $version]($style) "
version_format = "v${major}.${minor}"
style = "yellow"

# Only after failed commands: .zshrc drops the duration when the command worked
[cmd_duration]
min_time = 3000
format = "[took $duration]($style) "
style = "yellow"

# The exit code, only when it isn't 0
[status]
disabled = false
format = "[-> $status]($style) "
style = "bold red"
