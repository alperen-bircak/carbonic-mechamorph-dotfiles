# Merged with wiremix's defaults (opened from waybar with ephemeral-tui).
# Esc quits like the other TUIs; it still closes the help screen (?) first.
# Dropdowns close with Enter or a click instead.

# Start on the Output Devices tab
tab = "output"

keybindings = [
  { key = "Esc", action = "Exit" },
]

# Named ANSI colours, so these follow the terminal's palette. Blue is the
# indigo accent, on the selection only; the bars stay gray.
[themes.default]
selector = { fg = "Blue" }
tab_selected = { fg = "Blue" }
tab_marker = { fg = "Blue" }
volume_filled = { fg = "White" }
meter_active = { fg = "White" }
meter_center_active = { fg = "White" }
dropdown_selected = { fg = "Blue", add_modifier = "REVERSED" }
